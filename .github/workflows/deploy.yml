#the way this works basically is :
# ssh to the server (where an nginx reverse proxy routes traffic that hits our server through [our domain name, provisionally it is bruinbet.prygw.me] to the running node app) -> runs scripts/deploy.sh (starts the node processes)
- name: Deploy via SSH
    uses: appleboy/ssh-action@v1.0.3
    with:
      host: ${{secrets.SERVER_HOST}}
      username: ${{secrets.SERVER_USER}}
      password: ${{secrets.SERVER_PASSWORD}}
      script: |
        cd ~/BruinBet
        ./deploy.sh
